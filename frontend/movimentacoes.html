<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Fácil - Movimentações</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bibliotecas de Exportação Excel e PDF -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col md:flex-row">

    <!-- Overlay Mobile -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/60 z-40 hidden md:hidden transition-opacity"></div>

    <!-- Sidebar Menu Mobile/Desktop -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 flex flex-col justify-between transform -translate-x-full md:translate-x-0 md:static md:flex transition-transform duration-300 ease-in-out min-h-screen">
        <div>
            <div class="p-5 flex items-center justify-between border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">
                        <i class="fa-solid fa-boxes-packing"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-white leading-tight">Estoque Fácil</h1>
                        <span class="text-xs text-slate-400">Controle Inteligente</span>
                    </div>
                </div>
                <button id="closeSidebarBtn" class="md:hidden text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <nav class="p-4 space-y-1">
                <a href="/static/dashboard.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-slate-300 rounded-lg font-medium transition">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
                <a href="/static/produtos.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-slate-300 rounded-lg font-medium transition">
                    <i class="fa-solid fa-box"></i> Produtos
                </a>
                <a href="/static/movimentacoes.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-lg font-medium">
                    <i class="fa-solid fa-right-left"></i> Entradas / Saídas
                </a>
                <a href="/static/relatorios.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-slate-300 rounded-lg font-medium transition">
                    <i class="fa-solid fa-chart-pie"></i> Relatórios & SQL
                </a>
                <a href="/static/usuarios.html" id="navUsers" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-slate-300 rounded-lg font-medium transition hidden">
                    <i class="fa-solid fa-users-gear"></i> Usuários
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-slate-800">
            <button id="logoutBtn" class="w-full py-2 px-3 bg-slate-800 hover:bg-red-600/20 hover:text-red-400 text-slate-400 rounded-lg text-sm font-medium transition text-left flex items-center gap-2">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="bg-white border-b border-slate-200 p-4 flex items-center justify-between sticky top-0 z-30">
            <div class="flex items-center gap-2 md:gap-3">
                <button onclick="window.history.back()" class="text-slate-600 hover:text-blue-600 p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition" title="Voltar para a página anterior">
                    <i class="fa-solid fa-arrow-left text-base"></i>
                </button>
                <button id="openSidebarBtn" class="md:hidden text-slate-700 hover:text-blue-600 p-2 rounded-lg border border-slate-200">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <h2 class="text-lg md:text-xl font-bold text-slate-800">Entradas / Saídas</h2>
            </div>
        </header>


        <main class="p-4 md:p-6 space-y-6 overflow-y-auto">
            <!-- Form de Movimentação Expressa -->
            <div class="bg-white p-4 md:p-6 rounded-xl border border-slate-200 shadow-sm">
                <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2 text-base md:text-lg">
                    <i class="fa-solid fa-cart-flatbed text-blue-600"></i> Registrar Movimentação
                </h3>

                <form id="movForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo de Operação *</label>
                        <select id="movType" required class="w-full p-2.5 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="OUT">🟢 SAÍDA / VENDA</option>
                            <option value="IN">🔵 ENTRADA / REPOSIÇÃO</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Produto *</label>
                        <select id="movProductId" required class="w-full p-2.5 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">Carregando produtos...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Movimentar Por *</label>
                        <select id="movUnitMode" required class="w-full p-2.5 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50">
                            <option value="un">📦 Unidades Avulsas (un)</option>
                            <option value="cx">📦 Caixas Fechadas (cx)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Quantidade *</label>
                        <input type="number" id="movQuantity" min="1" required placeholder="Ex: 2" class="w-full p-2.5 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Observações (Opcional)</label>
                        <input type="text" id="movNotes" placeholder="Ex: Venda balcão / NF" class="w-full p-2.5 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div class="sm:col-span-2 lg:col-span-5 flex justify-end">
                        <button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg text-sm shadow transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-floppy-disk"></i> Confirmar Registros
                        </button>
                    </div>
                </form>

            </div>

            <!-- Histórico de Movimentações -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-4 md:p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                        <h3 class="font-bold text-slate-800 text-base md:text-lg">Histórico Recente</h3>
                        <span class="text-xs text-slate-400">Trilha de auditoria completa</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="btnMovExportExcel" title="Exportar histórico em Excel" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3 py-1.5 rounded-lg text-xs shadow transition flex items-center gap-1.5">
                            <i class="fa-solid fa-file-excel"></i> Excel
                        </button>
                        <button id="btnMovExportPDF" title="Exportar histórico em PDF" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-3 py-1.5 rounded-lg text-xs shadow transition flex items-center gap-1.5">
                            <i class="fa-solid fa-file-pdf"></i> PDF
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold border-b border-slate-200 whitespace-nowrap">
                                <th class="p-4">Data/Hora</th>
                                <th class="p-4">Tipo</th>
                                <th class="p-4">Produto</th>
                                <th class="p-4 text-center">Qtd</th>
                                <th class="p-4 text-right th-price hidden">Valor Unit.</th>
                                <th class="p-4">Usuário</th>
                                <th class="p-4">Observação</th>
                            </tr>
                        </thead>
                        <tbody id="movementsTable" class="divide-y divide-slate-100 text-sm whitespace-nowrap">
                            <tr><td colspan="7" class="p-4 text-center text-slate-400">Carregando histórico...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        if (!token) window.location.href = '/static/index.html';

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const openSidebarBtn = document.getElementById('openSidebarBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }

        openSidebarBtn?.addEventListener('click', openSidebar);
        closeSidebarBtn?.addEventListener('click', closeSidebar);
        sidebarOverlay?.addEventListener('click', closeSidebar);

        if (role === 'ADMIN') {
            document.getElementById('navUsers').classList.remove('hidden');
            document.querySelectorAll('.th-price').forEach(el => el.classList.remove('hidden'));
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '/static/index.html';
        });

        async function loadSelectProducts() {
            try {
                const res = await fetch('/api/products', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const products = await res.json();
                    const select = document.getElementById('movProductId');
                    select.innerHTML = '<option value="">Selecione um produto...</option>' + 
                        products.map(p => `<option value="${p.id}">${p.name} (Atual: ${p.quantity} ${p.unit})</option>`).join('');
                }
            } catch(err) { console.error(err); }
        }

        let currentMovementsList = [];

        async function loadMovementsHistory() {
            try {
                const res = await fetch('/api/movements', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    currentMovementsList = await res.json();
                    renderMovements(currentMovementsList);
                }
            } catch(err) { console.error(err); }
        }

        // --- EXPORTAÇÃO EXCEL & PDF DE MOVIMENTAÇÕES ---
        document.getElementById('btnMovExportExcel')?.addEventListener('click', () => {
            if (!currentMovementsList || currentMovementsList.length === 0) {
                alert('Nenhuma movimentação disponível para exportar.');
                return;
            }

            const dataToExport = currentMovementsList.map(m => {
                const item = {
                    'Data / Hora': new Date(m.created_at).toLocaleString('pt-BR'),
                    'Tipo Operação': m.type === 'IN' ? 'ENTRADA' : 'SAÍDA / VENDA',
                    'Produto': m.product_name,
                    'Quantidade (un)': m.quantity,
                    'Usuário Responsável': m.user_name,
                    'Observação': m.notes || '-'
                };
                if (role === 'ADMIN') {
                    item['Valor Unitário (R$)'] = m.unit_price || 0.0;
                }
                return item;
            });

            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Movimentações");
            XLSX.writeFile(workbook, `Historico_Movimentacoes_${new Date().toISOString().slice(0,10)}.xlsx`);
        });

        document.getElementById('btnMovExportPDF')?.addEventListener('click', () => {
            if (!currentMovementsList || currentMovementsList.length === 0) {
                alert('Nenhuma movimentação disponível para exportar.');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape' });

            doc.setFontSize(16);
            doc.setTextColor(30, 41, 59);
            doc.text("Estoque Fácil - Histórico de Movimentações (Entradas/Saídas)", 14, 15);
            doc.setFontSize(10);
            doc.setTextColor(100, 116, 139);
            doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, 14, 22);

            const tableHeaders = role === 'ADMIN'
                ? [["Data / Hora", "Tipo", "Produto", "Qtd", "Valor Unit (R$)", "Usuário", "Observação"]]
                : [["Data / Hora", "Tipo", "Produto", "Qtd", "Usuário", "Observação"]];

            const tableRows = currentMovementsList.map(m => {
                const row = [
                    new Date(m.created_at).toLocaleString('pt-BR'),
                    m.type === 'IN' ? 'ENTRADA' : 'SAÍDA',
                    m.product_name,
                    m.quantity
                ];
                if (role === 'ADMIN') {
                    row.push(m.unit_price ? m.unit_price.toFixed(2) : '0.00');
                }
                row.push(m.user_name, m.notes || '-');
                return row;
            });

            doc.autoTable({
                head: tableHeaders,
                body: tableRows,
                startY: 28,
                theme: 'striped',
                headStyles: { fillColor: [30, 41, 59], textColor: 255, fontStyle: 'bold' },
                styles: { fontSize: 9, cellPadding: 3 }
            });

            doc.save(`Historico_Movimentacoes_${new Date().toISOString().slice(0,10)}.pdf`);
        });

        function renderMovements(list) {
            const tbody = document.getElementById('movementsTable');
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">Nenhuma movimentação registrada.</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(m => `
                <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                    <td class="p-4 text-xs font-mono text-slate-500">${new Date(m.created_at).toLocaleString('pt-BR')}</td>
                    <td class="p-4">
                        ${m.type === 'IN' 
                            ? `<span class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-arrow-down"></i> ENTRADA</span>`
                            : `<span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-arrow-up"></i> SAÍDA</span>`
                        }
                    </td>
                    <td class="p-4 font-semibold text-slate-800">${m.product_name}</td>
                    <td class="p-4 text-center font-bold text-slate-700">${m.quantity}</td>
                    ${role === 'ADMIN' ? `<td class="p-4 text-right font-mono text-slate-600">R$ ${m.unit_price ? m.unit_price.toFixed(2) : '0.00'}</td>` : ''}
                    <td class="p-4 text-slate-600"><i class="fa-solid fa-user text-xs mr-1 text-slate-400"></i> ${m.user_name}</td>
                    <td class="p-4 text-slate-500 text-xs">${m.notes || '-'}</td>
                </tr>
            `).join('');
        }

        document.getElementById('movForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                product_id: parseInt(document.getElementById('movProductId').value),
                type: document.getElementById('movType').value,
                unit_mode: document.getElementById('movUnitMode').value,
                quantity: parseInt(document.getElementById('movQuantity').value),
                notes: document.getElementById('movNotes').value || null
            };


            try {
                const res = await fetch('/api/movements', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    document.getElementById('movQuantity').value = '';
                    document.getElementById('movNotes').value = '';
                    loadSelectProducts();
                    loadMovementsHistory();
                } else {
                    const data = await res.json();
                    alert(data.detail || 'Erro ao registrar movimentação.');
                }
            } catch(err) { console.error(err); }
        });

        loadSelectProducts();
        loadMovementsHistory();
    </script>
</body>
</html>
